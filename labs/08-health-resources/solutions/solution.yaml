apiVersion: v1
kind: Namespace
metadata: { name: lab-08 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: lab-08, labels: { app: api } }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: app
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports: [{ containerPort: 9898 }]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          startupProbe:
            httpGet: { path: /healthz, port: 9898 }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /readyz, port: 9898 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 9898 }
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: lab-08 }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 50 }
---
apiVersion: v1
kind: Pod
metadata: { name: besteffort, namespace: lab-08 }
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata: { name: burstable, namespace: lab-08 }
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 10m, memory: 16Mi }
---
apiVersion: v1
kind: Pod
metadata: { name: guaranteed, namespace: lab-08 }
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits:   { cpu: 50m, memory: 64Mi }
