apiVersion: v1
kind: Pod
metadata:
  name: slow-start
  labels: { app: slow-start }
spec:
  containers:
    - name: app
      image: ghcr.io/stefanprodan/podinfo:6.7.1
      command: ["./podinfo", "--port=9898", "--random-delay", "--random-delay-min=15", "--random-delay-max=20"]
      ports: [{ containerPort: 9898 }]
      startupProbe:
        httpGet: { path: /healthz, port: 9898 }
        failureThreshold: 30
        periodSeconds: 2
      readinessProbe:
        httpGet: { path: /readyz, port: 9898 }
        periodSeconds: 5
      livenessProbe:
        httpGet: { path: /healthz, port: 9898 }
        periodSeconds: 10
        failureThreshold: 3
