---
# Source: scribe/templates/configmaps.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: lab-12
  labels:
    app.kubernetes.io/name: scribe
    app.kubernetes.io/instance: scribe
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: scribe-0.1.0
data:
  # Minimal nginx site config — proxies /api to the backend Service.
  default.conf: |
    server {
      listen 80 default_server;
      server_name _;
      location /api/ {
        proxy_pass http://backend.lab-12.svc.cluster.local/;
        proxy_set_header Host $host;
      }
      location / {
        return 200 'scribe frontend ok\n';
        add_header Content-Type text/plain;
      }
    }
