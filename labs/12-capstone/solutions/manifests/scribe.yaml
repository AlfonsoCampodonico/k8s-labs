apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lab-12
  labels:
    app.kubernetes.io/name: scribe
    app.kubernetes.io/instance: scribe
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: scribe-0.1.0
