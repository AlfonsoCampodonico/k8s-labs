apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: lab-12
  labels:
    app.kubernetes.io/name: scribe
    app.kubernetes.io/instance: scribe
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: scribe-0.1.0
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50

