---
# Source: scribe/templates/backend.yaml
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: lab-12
  labels:
    app.kubernetes.io/name: scribe
    app.kubernetes.io/instance: scribe
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: scribe-0.1.0
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - { name: http, port: 80, targetPort: 9898 }
---
# Source: scribe/templates/backend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: lab-12
  labels:
    app: backend
    app.kubernetes.io/name: backend
    app.kubernetes.io/name: scribe
    app.kubernetes.io/instance: scribe
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: scribe-0.1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        app.kubernetes.io/name: backend
    spec:
      containers:
        - name: app
          image: "ghcr.io/stefanprodan/podinfo:6.7.1"
          ports: [{ name: http, containerPort: 9898 }]
          envFrom:
            - configMapRef: { name: backend-config }
          env:
            - name: DATABASE_HOST
              value: postgres.lab-12.svc.cluster.local
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: username }
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: password }
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef: { name: postgres-credentials, key: database }
          readinessProbe:
            httpGet: { path: /readyz, port: 9898 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 9898 }
            periodSeconds: 10
          resources:
            limits:
              cpu: 250m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
