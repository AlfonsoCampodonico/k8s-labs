# Source: scribe/templates/frontend.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: lab-12
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/name: scribe
    app.kubernetes.io/instance: scribe
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: scribe-0.1.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/name: frontend
    spec:
      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-config
            items:
              - { key: default.conf, path: default.conf }
      containers:
        - name: nginx
          image: "nginx:1.27-alpine"
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
          resources:
            limits:
              cpu: 200m
              memory: 64Mi
            requests:
              cpu: 25m
              memory: 32Mi
