# Source: scribe/templates/namespace.yaml
# Owned by Helm so `helm install scribe ./charts/scribe -n lab-12 --create-namespace`
# is not strictly required, but `--create-namespace` is the conventional flag.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-12
  labels:
    app.kubernetes.io/name: scribe
    app.kubernetes.io/instance: scribe
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: scribe-0.1.0
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: baseline

---
# Source: scribe/templates/networkpolicies.yaml
# Three-layer network policy: deny-all by default, then explicit
# frontend → backend → postgres allow.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: lab-12
  labels:
    app.kubernetes.io/name: scribe
    app.kubernetes.io/instance: scribe
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: scribe-0.1.0
spec:
  # Empty podSelector selects every pod in the namespace.
  podSelector: {}
  policyTypes: [Ingress]
---
# Source: scribe/templates/networkpolicies.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-frontend
  namespace: lab-12
  labels:
    app.kubernetes.io/name: scribe
    app.kubernetes.io/instance: scribe
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: scribe-0.1.0
spec:
  podSelector:
    matchLabels: { app: frontend }
  policyTypes: [Ingress]
  ingress:
    - from:
        # Ingress-nginx controller lives in the ingress-nginx namespace.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - { protocol: TCP, port: 80 }
---
