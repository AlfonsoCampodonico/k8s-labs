apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer-secret
  labels: { app: consumer-secret }
spec:
  replicas: 1
  selector: { matchLabels: { app: consumer-secret } }
  template:
    metadata: { labels: { app: consumer-secret } }
    spec:
      volumes:
        - name: creds
          secret:
            secretName: db-cred
            defaultMode: 0400
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "ls -l /run/creds; sleep 3600"]
          volumeMounts:
            - { name: creds, mountPath: /run/creds, readOnly: true }
