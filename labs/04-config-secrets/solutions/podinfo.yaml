apiVersion: v1
kind: Namespace
metadata: { name: lab-04 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: podinfo-cfg, namespace: lab-04 }
data:
  PODINFO_UI_COLOR: "#34568B"
  PODINFO_UI_MESSAGE: "hello from v1"
---
apiVersion: v1
kind: ConfigMap
metadata: { name: podinfo-cfg-v2, namespace: lab-04 }
immutable: true
data:
  PODINFO_UI_COLOR: "#9B2335"
  PODINFO_UI_MESSAGE: "hello from v2"
---
apiVersion: v1
kind: Secret
metadata: { name: podinfo-creds, namespace: lab-04 }
type: Opaque
stringData:
  api_key: "not-a-real-key"
  api_secret: "not-a-real-secret"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: podinfo, namespace: lab-04, labels: { app: podinfo } }
spec:
  replicas: 2
  selector: { matchLabels: { app: podinfo } }
  template:
    metadata: { labels: { app: podinfo, lab: "04" } }
    spec:
      volumes:
        - name: creds
          secret:
            secretName: podinfo-creds
            defaultMode: 0400
      containers:
        - name: app
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports: [{ containerPort: 9898 }]
          envFrom:
            - configMapRef: { name: podinfo-cfg-v2 }
          volumeMounts:
            - { name: creds, mountPath: /etc/podinfo/creds, readOnly: true }
          readinessProbe: { httpGet: { path: /readyz, port: 9898 } }
          resources: { requests: { cpu: 25m, memory: 32Mi } }
---
# C3 — broken-consumer + the fix. broken-cfg here intentionally includes
# the DB_URL key that the manifests/ version was missing; the lesson is
# that a missing ConfigMap key turns into a CreateContainerConfigError
# at pod start, not at apply time.
apiVersion: v1
kind: ConfigMap
metadata: { name: broken-cfg, namespace: lab-04 }
data:
  LOG_LEVEL: info
  DB_URL: "postgres://db.lab-04.svc.cluster.local:5432/app"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: broken-consumer, namespace: lab-04, labels: { app: broken-consumer } }
spec:
  replicas: 1
  selector: { matchLabels: { app: broken-consumer } }
  template:
    metadata: { labels: { app: broken-consumer } }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "echo DB=${DB_URL}; sleep 3600"]
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: broken-cfg
                  key: DB_URL
