apiVersion: v1
kind: Namespace
metadata: { name: lab-07 }
---
apiVersion: batch/v1
kind: Job
metadata: { name: report, namespace: lab-07 }
spec:
  completions: 4
  parallelism: 2
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: report
          image: busybox:1.36
          command: ["sh", "-c", "echo report-ok; sleep 2"]
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: nightly, namespace: lab-07 }
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: nightly
              image: busybox:1.36
              command: ["sh", "-c", "date; exit 0"]
---
apiVersion: batch/v1
kind: Job
metadata: { name: flaky, namespace: lab-07 }
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: flaky
          image: busybox:1.36
          command: ["sh", "-c", "exit 1"]
