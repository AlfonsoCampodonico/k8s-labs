apiVersion: batch/v1
kind: Job
metadata: { name: shards }
spec:
  completions: 4
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 2
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "I am index ${JOB_COMPLETION_INDEX} of 4"
