apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken
  namespace: lab-03
  labels: { app: broken }
spec:
  replicas: 2
  selector:
    matchLabels: { app: broken }
  template:
    metadata:
      labels: { app: broken, tier: frontend }
    spec:
      containers:
        - name: app
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: broken
  namespace: lab-03
  labels: { app: broken }
spec:
  # BUG: the selector uses 'App' (capital A) instead of 'app'. Endpoints
  # will be empty. Fix via `kubectl patch svc broken -n lab-03 --type=merge ...`
  # — do NOT delete and recreate the Service.
  selector:
    App: broken
  ports:
    - port: 80
      targetPort: 80
