apiVersion: apps/v1
kind: Deployment
metadata: { name: a, labels: { app: a } }
spec:
  replicas: 1
  selector: { matchLabels: { app: a } }
  template:
    metadata: { labels: { app: a } }
    spec:
      containers:
        - name: a
          image: busybox:1.36
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: b, labels: { app: b } }
spec:
  replicas: 1
  selector: { matchLabels: { app: b } }
  template:
    metadata: { labels: { app: b } }
    spec:
      containers:
        - name: b
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata: { name: b }
spec:
  selector: { app: b }
  ports: [{ port: 80, targetPort: 80 }]
