apiVersion: v1
kind: Pod
metadata:
  name: writer
  labels:
    app: writer
spec:
  volumes:
    - name: shared-logs
      emptyDir: {}
  containers:
    - name: producer
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          while true; do
            echo "$(date -u +%FT%TZ) hello from producer" >> /data/app.log
            sleep 2
          done
      volumeMounts:
        - name: shared-logs
          mountPath: /data
    - name: tailer
      image: busybox:1.36
      command: ["sh", "-c", "tail -F /data/app.log"]
      volumeMounts:
        - name: shared-logs
          mountPath: /data
