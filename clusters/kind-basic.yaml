# Default cluster topology used by the course.
#
# One control-plane node plus two workers is enough to demonstrate
# scheduling, node selectors, affinities, and pod disruption without
# flattening a laptop.
#
# The control-plane node publishes port 80/443 on the host so the Ingress
# labs work without `kubectl port-forward`. extraPortMappings use
# `listenAddress: "127.0.0.1"` to avoid surprising the student's network.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-labs
networking:
  apiServerAddress: "127.0.0.1"
  # Disable the default CNI so students can (optionally) install a different
  # CNI in lab 09. kindnet is re-enabled below by leaving the field unset.
nodes:
  - role: control-plane
    # `ingress-ready=true` is the kind-canonical label the nginx ingress
    # controller looks for. It's not in the reserved kubernetes.io/ namespace,
    # so kubelet is allowed to self-apply it via --node-labels.
    #
    # The `node-role.kubernetes.io/edge` label is NOT applied here: kubelet's
    # NodeRestriction admission plugin forbids a node from labeling itself
    # under kubernetes.io/, and kind's `labels:` block goes through that same
    # restricted path. We apply that label in bin/cluster-up.sh via
    # `kubectl label`, which runs as an authenticated client and is allowed.
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
    labels:
      topology.k8s-labs/zone: "a"
  - role: worker
    labels:
      topology.k8s-labs/zone: "b"
